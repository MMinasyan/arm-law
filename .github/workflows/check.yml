name: Check ArmLaw
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.11"
          - os: macos-14
            python: "3.13"
          - os: windows-2022
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Search and tool schema
        run: uv run --no-project --python "${{ matrix.python }}" --with ".[verify]" python -B test_search.py
      - name: Document destinations
        run: uv run --no-project --python "${{ matrix.python }}" --with ".[verify]" python -B test_act.py
      - name: Portable package and cold runtime
        run: uv run --no-project --python "${{ matrix.python }}" --with ".[verify]" python -B test_plugin.py
