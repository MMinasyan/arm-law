[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arlis"
version = "1.0.0"
description = "Legal research tools for arlis.am"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.9.0",
    "lxml>=4.6.0",
    "mcp>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["arlis*"]
